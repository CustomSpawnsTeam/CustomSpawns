name: Publish

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  publish:
    uses: CustomSpawnsTeam/workflows/.github/workflows/publish-common.yml@master
    with:
      mod_id: CustomSpawns
      workshop_id: 2878685456
      nexusmods_mod_id: "411"
      # Calradia at War's bundle stays the mod page's primary download
      nexusmods_primary_download: false
    # Passes the repository and organisation secrets on, NEXUSMODS_APIKEY is an organisation secret
    secrets: inherit